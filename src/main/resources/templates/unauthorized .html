<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied</title>
  <style>
    body {
      font-family: Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      margin: 0;
    }

    .container {
      text-align: center;
      padding: 2rem;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      background-color: #fff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #4285f4;
    }

    p {
      font-size: 1.2rem;
      color: #757575;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Access Denied</h1>
  <p>You do not have permission to access this page.</p>
</div>
</body>
</html>
