<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Device Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Admin Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin}" href="#">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/users}" href="#">Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/vehicles}" href="#">Vehicles</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/gpsDevices}" href="#">GPS</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/logs}" href="#">logs</a>
                </li>
                <li class="nav-item">
                    <form action="#" th:action="@{/auth/logout}" method="post" style="display:inline;">
                        <button type="submit" class="nav-link btn btn-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>GPS Device Details</h2>
    <table class="table">
        <tbody>
            <tr>
                <th>IMEI</th>
                <td th:text="${gpsDevice.imei}"></td>
            </tr>
            <tr>
                <th>Model</th>
                <td th:text="${gpsDevice.model}"></td>
            </tr>
            <tr>
                <th>Manufacturer</th>
                <td th:text="${gpsDevice.manufacturer}"></td>
            </tr>
            <tr>
                <th>Installation Date</th>
                <td th:text="${gpsDevice.installationDate}"></td>
            </tr>
            <tr>
                <th>Status</th>
                <td th:text="${gpsDevice.status}"></td>
            </tr>
            <tr>
                <th>Vehicle</th>
                <td th:text="${gpsDevice.vehicle.registrationNumber}"></td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/admin/gpsDevices}" class="btn btn-secondary">Back to List</a>
    <a th:href="@{/admin/gpsDevices/edit/{id}(id=${gpsDevice.id})}" class="btn btn-primary">Edit</a>
</div>

<footer class="bg-dark text-white text-center py-2">
    <p>&copy; 2024 GPS Tracking System. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
