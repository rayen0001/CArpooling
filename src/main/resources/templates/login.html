<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GPS Tracking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            opacity: 0.5;
            transform: translate(-50%, -50%);
            background-size: cover;
            background-position: center;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .form-title {
            color: #007bff;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(90deg, #007bff, #00c6ff);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #0056b3, #007bff);
        }
    </style>
</head>
<body>
<video autoplay muted loop class="video-bg">
    <source src="/images/bg.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div class="d-flex justify-content-center align-items-center" style="height: 100%;">
    <div class="container">
        <h2 class="text-center form-title">Login</h2>
        <form th:action="@{/auth/login}" method="post" th:object="${loginUserDto}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" th:field="*{email}" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" th:field="*{password}" required>
            </div>

            <div class="text-danger text-center mb-3" th:if="${errorMessage}">
                <p th:text="${errorMessage}"></p>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
