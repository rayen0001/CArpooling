<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit GPS Device</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Admin Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin}" href="#">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/users}" href="#">Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/vehicles}" href="#">Vehicles</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/gpsDevices}" href="#">GPS</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/logs}" href="#">logs</a>
                </li>
                <li class="nav-item">
                    <form action="#" th:action="@{/auth/logout}" method="post" style="display:inline;">
                        <button type="submit" class="nav-link btn btn-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Edit GPS Device</h2>
    <form th:action="@{/admin/gpsDevices/edit/{id}(id=${gpsDevice.id})}" method="post">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="imei" class="form-label">IMEI</label>
                <input type="text" id="imei" name="imei" class="form-control" th:value="${gpsDevice.imei}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="model" class="form-label">Model</label>
                <input type="text" id="model" name="model" class="form-control" th:value="${gpsDevice.model}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="manufacturer" class="form-label">Manufacturer</label>
                <input type="text" id="manufacturer" name="manufacturer" class="form-control" th:value="${gpsDevice.manufacturer}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="installationDate" class="form-label">Installation Date</label>
                <input type="date" id="installationDate" name="installationDate" class="form-control" th:value="${gpsDevice.installationDate}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="status" class="form-label">Status</label>
                <select id="status" name="status" class="form-select" required>
                    <option th:selected="${gpsDevice.status == 'Active'}" value="Active">Active</option>
                    <option th:selected="${gpsDevice.status == 'Inactive'}" value="Inactive">Inactive</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="vehicle" class="form-label">Assigned Vehicle</label>
                <select id="vehicle" name="vehicleId" class="form-select">
                    <option value="">Select Vehicle</option>
                    <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.name}" th:selected="${gpsDevice.vehicle?.id == vehicle.id}"></option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>

<footer class="bg-dark text-white text-center py-2">
    <p>&copy; 2024 GPS Tracking System. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
